<!DOCTYPE html>
<html>
<head>
  <title>My Image Gallery</title>
  <style>
    body {
      background-color: pink;
      text-align: center;
    }
    h1 {
      color: #333;
    }
    .gallery {
      display: grid;
      grid-template-columns: auto auto auto;
      gap: 15px;
      padding: 20px;
    }
    .gallery img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      border-radius: 10px;
    }
  
  </style>
</head>
<body>
  <h1>My Image Gallery</h1>
  <div class="gallery">
    <img src="img/download (1).jpeg" alt="Nature 1">
    <img src="img/download (2).jpeg" alt="Nature 2">
    <img src="img/download (3).jpeg" alt="Nature 3">
    <img src="img/download.jpeg" alt="Nature 4">
    <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e" alt="Nature 5">
    <img src="https://images.unsplash.com/photo-1523983302085-5c3c1e06a8f7" alt="Nature 6">
    <img src="https://images.unsplash.com/photo-1494783367193-149034c05e8f" alt="Nature 7">
    <img src="https://images.unsplash.com/photo-1498050108023-c5249f4df085" alt="Nature 8">
    <img src="https://images.unsplash.com/photo-1537498425277-c283d32ef9db" alt="Nature 9">
    <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470" alt="Nature 10">
     <img src="https://images.unsplash.com/photo-1522202176988-66273c2fd55f" alt="Nature 11">
    <img src="https://images.unsplash.com/photo-1519125323398-675f0ddb6308" alt="Nature 12">
  </div>
</body>
</html>
